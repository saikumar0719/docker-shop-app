# docker-compose.yml — run the app with ONE command: `docker compose up`
# Compose is a helper: instead of typing a long `docker run` command,
# you write the settings here once, and Compose remembers them.

services:
  # The service is called shop-app. A service is one lunchbox to run.
  shop-app:
    # build: make the image from the Dockerfile in this folder (".").
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: give the running box a clear name.
    container_name: shop-app-run
    # No port is needed: this app only prints numbers, it is not a website.
