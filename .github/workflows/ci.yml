name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q
      - run: bash -n scripts/build_image.sh scripts/run_app.sh
      - run: docker build -t shop-app:1.0.0 .
      - run: docker run --rm shop-app:1.0.0 | tee run_output.txt
      - run: 'grep -q "Total sales: 10550.00" run_output.txt'
      - run: docker compose config -q || echo "compose check skipped (docker compose not available on this runner)"
